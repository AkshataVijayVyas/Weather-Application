<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="card">
        <h1 class="title">Weather Application</h1>
        <div class="search">
            <input type="text" placeholder="Enter the city name" spellcheck="false">
            <button> <img src="images/search.png" ></button>
        </div>

        <div class="error">
            <p>Invalid city name</p>
        </div>

        <div class="weather">
            <img src="images/rain.png" class="weather-icon">
            <h3 class="city" ></h3>
            <p>Temperature</p>
            <h1 class="temperature"></h1>
            <p>feels like</p>
            <h2 class="feels-like"> </h2>

            <div class="container">
            <div class="column">
                <div class="row">
                    <p><b>Temp min:</b></p>
                    <p class="Tempmin">20°C</p> 
                </div>
                
                <div class="row">
                    <p><b>Temp max:</b></p>
                    <p class="Tempmax">30°C</p>
                </div>
            </div>
            
            <div class="column">
                <div class="row">
                    <p><b>Sunrise:</b></p>
                    <p class="Sunrise"></p>
                </div>
                
                <div class="row">
                    <p><b>Sunset:</b></p>
                    <p class="Sunset"></p>
                </div>
            </div>
            </div>
            

            <div class="details">
                
                <div class="col">
                    <img src="images/humidity.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <img src="images/windspeed.jpg">
                    <div>
                        <p class="wind">15 kmph</p>
                        <p>Wind Speed</p>
                   
                    </div>
                </div>
            </div> 

            <div class="Moreinfo">
                
                <div>
                    <p><b>Air Pressure</b></p>
                    <p class="Airpressure"></p>
                </div>
                <div>
                    <p><b>Visibility</b></p>
                    <p class="Visibility"></p>
                    
                </div>
                
                
            </div>
        </div>

        

    </div>

    <script>
        //Open Weather Map API (API request by city name)
        const apiKey="a21a5b20cc8805873a2304f09bfcd421";
        const apiUrl="https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";
        
        //Javascript used to fetch weather details from the Weather API
        
        //fetches the input from user
        const SearchBox=document.querySelector(".search input");
        const Button=document.querySelector(".search button");

        //when the Search button is clicked city info is sent to checkWeather function
        Button.addEventListener("click",()=>{
            checkWeather(SearchBox.value); //city name written in input field
        });

        // Listen for Enter key press in the input field
        SearchBox.addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                checkWeather(SearchBox.value);
            }
        });

        //fetches the weather details into weatherIcon
        const weatherIcon=document.querySelector(".weather-icon");

        
        //function to check weather
        async function checkWeather(city) {

            try{
                const response = await fetch(`${apiUrl}${city}&appid=${apiKey}`);
                var data=await response.json();

                //To display error message
            
                if(data.cod!==200 ||!data.sys|| !data.name){   //404 error is not found HTTP status 
                    document.querySelector(".error").style.display="block";
                    document.querySelector(".weather").style.display="none";
                    return;
                }
            
            
                console.log(data);

                // hide error when a valid city is found
                document.querySelector(".error").style.display="none";

                //To hide the weather initially
                document.querySelector(".weather").style.display="block";

                //To update the text according to the weather
                document.querySelector(".city").innerHTML=data.name +"("+data.sys.country+")"; //route is according to the console
                document.querySelector(".temperature").innerHTML=Math.round(data.main.temp)+"°C"; //temperature is rounded off eg:20
                document.querySelector(".feels-like").innerHTML=Math.round(data.main.feels_like)+ "°C"
                document.querySelector(".humidity").innerHTML=data.main.humidity+"%";
                document.querySelector(".wind").innerHTML=data.wind.speed+"kmph";

                document.querySelector(".Airpressure").innerHTML=data.main.pressure+" "+"hPa";
                document.querySelector(".Visibility").innerHTML=data.visibility+" "+"mts";

                document.querySelector(".Tempmin").innerHTML=Math.round(data.main.temp_min)+"°C";
                document.querySelector(".Tempmax").innerHTML=Math.round(data.main.temp_max)+"°C";

                document.querySelector(".Sunrise").innerHTML=convertTime(data.sys.sunrise,data.timezone);
                document.querySelector(".Sunset").innerHTML=convertTime(data.sys.sunset,data.timezone);

                //To update the images according to the weather
                if(data.weather[0].main=="Clouds"){
                    weatherIcon.src="images/cloudy.jpg";
                }
                else if(data.weather[0].main=="Rain"){
                    weatherIcon.src="images/rain.png";
                }
                else if(data.weather[0].main=="Sunny"){
                    weatherIcon.src="images/sunny.png";
                }
                else if(data.weather[0].main=="Drizzle"){
                    weatherIcon.src="images/drizzle.avif";
                }
                else if(data.weather[0].main=="Mist"){
                    weatherIcon.src="images/mist.png";
                }
                else if(data.weather[0].main=="Thunderstorm"){
                    weatherIcon.src="images/tunderstrom.jpg";
                }
                else if(data.weather[0].main=="Clear"){
                    weatherIcon.src="images/clearsky.jpg";
                }
                else if(data.weather[0].main=="Snow"){
                    weatherIcon.src="images/snow.png"; 
                }            
            
            }catch(error){
                console.error("Error fetching weather data:", error);
                document.querySelector(".error").style.display = "block";
                document.querySelector(".weather").style.display = "none";
            }

        }
    
        function convertTime(timeinseconds,timezone) {
            // Multiplying by 1000 to convert from seconds to milliseconds
            let date = new Date((timeinseconds+ timezone) * 1000); 
    
            // Get the hours and minutes
            let hours = date.getHours();
            let minutes = "0" + date.getMinutes(); //2 digits

            // 12-hour format
            let ampm = hours >= 12 ? 'PM' : 'AM'; 
            hours = hours % 12; // Converting to 12-hour format
            hours = hours ? hours : 12; // hour '0' to be '12'

            //time as hours and minutes 
            let Time = hours + ':' + minutes.substr(-2) + ' ' + ampm;

            return Time;
        }
    </script>
</body>

</html>
